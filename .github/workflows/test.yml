name: 'Tests'

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

permissions:
  contents: 'read'

jobs:
  unit-tests:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Run unit tests'
        run: node --test 'scripts/**/*.test.js'

  pytest:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Set up Python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: 'Install pytest'
        run: python -m pip install 'pytest==8.3.5'

      - name: 'Run release script tests'
        run: python -m pytest -q scripts/release/py

  zizmor:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Set up Python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: 'Install zizmor'
        run: python -m pip install 'zizmor==1.30.1'

      - name: 'Audit the release workflows'
        run: zizmor --offline .github/workflows/release.yml .github/workflows/publish.yml .github/workflows/test.yml
