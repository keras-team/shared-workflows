name: 'Auto-Assignment (Reusable)'

on:
  workflow_call:
    inputs:
      issue_assignees:
        description: 'Comma-separated list of GitHub usernames to assign issues to on rotation'
        required: false
        type: string
        default: 'maitry63,mrinalghoshh,dhantule'
      pr_assignees:
        description: 'Comma-separated list of GitHub usernames to assign PRs to on rotation'
        required: false
        type: string
        default: ''
      pr_reviewers:
        description: 'Comma-separated list of GitHub usernames to request reviews from on PRs'
        required: false
        type: string
        default: ''
      ref:
        description: 'Git ref (branch, tag, or commit SHA) of shared-workflows to check out (defaults to job.workflow_sha)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  auto_assign:
    runs-on: ubuntu-latest
    steps:
      - name: 'Check out shared workflows repo'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'keras-team/shared-workflows'
          ref: '${{ inputs.ref || job.workflow_sha }}'
          persist-credentials: false
          path: '.shared-workflows'

      - name: 'Auto-assign on rotation'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CONFIG_ISSUE_ASSIGNEES: '${{ inputs.issue_assignees }}'
          CONFIG_PR_ASSIGNEES: '${{ inputs.pr_assignees }}'
          CONFIG_PR_REVIEWERS: '${{ inputs.pr_reviewers }}'
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          script: |
            const autoAssign = require('./.shared-workflows/scripts/auto-assignment.js');
            await autoAssign({ github, context, core });
